[package]
name = "nyra"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.95"
description = "Portable system diagnostics"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
get_if_addrs = "0.5.3"
hickory-resolver = { version = "0.26.3", default-features = false, features = ["system-config", "tokio"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "rustls"] }
rustls = "0.23"
rustls-platform-verifier = "0.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
sysinfo = { version = "0.40.4", default-features = false, features = ["disk", "linux-tmpfs", "system"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
tokio-rustls = "0.26.6"
x509-parser = "0.18.1"
