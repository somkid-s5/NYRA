# NYRA example settings.
# Currently NYRA reads appearance theme/no-color/motion settings, knowledge-card favorites, and discovery preferences.
# Custom themes are loaded from themes/custom.toml beside this config directory; see custom-theme.toml.
# Portable mode is selected by portable.flag, not by this example's boolean.
[general]
language = "en"
startup_mode = "interactive"
portable = true
check_updates = false

[appearance]
theme = "neo-tokyo"
# Set theme = "custom" to load themes/custom.toml.
no_color = false
animations = true
animation_speed = "normal"
reduced_motion = false
compact_mode = false

[sound]
enabled = true
volume = 40
startup = true
navigation = false
success = true
warning = true
error = true
workflow_complete = true

[search]
fuzzy = true
include_aliases = true
remember_recent = true

[execution]
default_timeout_seconds = 5
confirm_risky_commands = true
max_parallel_tasks = 5

[history]
enabled = true
max_entries = 500

[reports]
format = "html"
directory = "./reports"

[knowledge]
favorites = []

[discovery]
favorite_tools = []
recent_tools = []
record_recent = true
