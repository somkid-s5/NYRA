<text x="56" y="192" class="name">CLI</text>
<text x="56" y="254" class="name">Terminal UI</text>
<text x="56" y="316" class="name">Workflow runner</text>
<text x="367" y="228" class="name">Registry and executor</text>
<text x="367" y="252" class="small">Typed inputs and capabilities</text>
<text x="367" y="275" class="small">Deadlines and cancellation</text>
<text x="706" y="188" class="name">Diagnostic tools</text>
<text x="706" y="211" class="small">Native checks and</text>
<text x="706" y="229" class="small">platform adapters</text>
<text x="706" y="294" class="name">Structured result</text>
<text x="706" y="316" class="small">Finding and run status</text>
<text x="942" y="294" class="name">Report export</text>
<text x="942" y="316" class="small">Explicit and redacted</text>
<path d="M40 355H1080" stroke="#c3d1db"/>
<text x="40" y="380" class="small">The CLI and terminal UI present the same findings. A workflow submits each step to the same executor.</text>
