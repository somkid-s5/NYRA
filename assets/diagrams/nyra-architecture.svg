<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" role="img" aria-labelledby="title desc">
<title id="title">NYRA diagnostic architecture</title>
<desc id="desc">CLI, terminal UI, and workflows call a shared registry and executor. The executor runs platform-aware tools and produces a structured result. Explicit exports pass through redaction.</desc>
<defs>
<marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#526575"/></marker>
<style>
.heading{font:40px 'Instrument Serif',Georgia,serif;fill:#172b39}.name{font:600 18px Geist,system-ui,sans-serif;fill:#172b39}.small{font:14px Geist,system-ui,sans-serif;fill:#405666}.label{font:600 12px 'Geist Mono',monospace;letter-spacing:1px;fill:#405666}.box{fill:#fff;stroke:#9eafbb}.flow{fill:none;stroke:#526575;stroke-width:1.5;marker-end:url(#arrow)}
</style>
</defs>
<rect width="1120" height="400" fill="#f4f9fb"/>
