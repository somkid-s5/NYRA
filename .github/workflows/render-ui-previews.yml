name: Render editable NYRA TUI mockups to PNG
on:
  push:
    branches: [main]
    paths:
      - 'assets/mockups/*.svg'
      - 'scripts/render_mockups.py'
      - '.github/workflows/render-ui-previews.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install render dependencies
        run: python -m pip install --disable-pip-version-check 'cairosvg==2.7.1' 'pillow==11.0.0'
      - name: Render SVG prototypes as PNGs
        run: python scripts/render_mockups.py
      - name: Commit generated image previews
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/mockups/*.png
          if git diff --cached --quiet; then
            echo "No changes to render outputs."
          else
            git commit -m 'design: render NYRA theme mockups as PNG previews'
            git push
          fi
